name: Anime Sub Auto-Poster Monitor

on:
  schedule:
    # One independent monitor cycle every 15 minutes.
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: anime-sub-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    # 25 min of monitoring + ~4 min of setup, plus one overrunning cycle.
    # At 35 the Rocks retries pushed runs over the limit and GitHub CANCELLED
    # them — and a cancelled run never chains, so the bot silently stopped.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          # Nothing is ever read from .git/config: the push credentials are
          # supplied per-command as an extraheader inside the commit step (F9).
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies & Multimedia Tools
        run: |
          npm ci --omit=dev
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          # Install ONE apt transaction first (P-5: six separate transactions
          # per run cost an estimated +20–90 s of setup). apt aborts the WHOLE
          # transaction when one package is missing from the archive: the
          # `p7zip-rar` package disappeared from ubuntu-26.04 and took
          # aria2/mkvtoolnix/megatools/unrar down with it, so every official
          # torrent was silently skipped while the job stayed green.
          # p7zip-rar is gone: `unrar` provides the RAR capability and the npm
          # `7zip-bin` dependency ships the 7z binary the extraction code uses.
          if ! sudo apt-get install -y --no-install-recommends mkvtoolnix aria2 megatools zip p7zip-full unrar; then
            # Fallback: one package per transaction, so a single missing package can no
            # longer poison the others (this is the P0-2 root cause).
            for pkg in mkvtoolnix aria2 megatools zip p7zip-full unrar; do
              if ! sudo apt-get install -y --no-install-recommends "$pkg"; then
                echo "::warning::failed to install $pkg — continuing with the remaining packages"
              fi
            done
          fi
          pip install --no-cache-dir curl_cffi

      - name: Verify Multimedia Tools
        id: verify-tools
        # aria2c + mkvextract are what hasRequiredTools() probes. A missing
        # tool does NOT fail the job: failing here would skip the monitor
        # step entirely and turn a partial degradation into a total outage
        # (and would make the `deferred` counter unreachable in CI). The
        # consequence is decided by the P0-3 counters instead — a window that
        # publishes nothing while candidates were deferred becomes red.
        run: |
          missing=""
          echo "Multimedia tool summary:"
          for tool in aria2c mkvextract 7z 7za unrar mega-get; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "  ✅ $tool"
            else
              echo "  ⚠️  $tool not found"
            fi
          done
          for tool in aria2c mkvextract; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::warning::required media tool missing: $tool"
              missing="${missing}${missing:+,}${tool}"
            fi
          done
          echo "tools_missing=${missing}" >> "$GITHUB_OUTPUT"
          echo "✅ Tool check complete (missing: ${missing:-none})."

      - name: Run continuous monitor loop
        id: monitor
        env:
          # Some Arabic fansub sites use certificate chains trusted by the
          # runner's system store but absent from Node's bundled CA set.
          # Keep TLS validation enabled while allowing Node to use that store.
          NODE_OPTIONS: --use-system-ca
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TARGET_CHANNEL: ${{ secrets.TELEGRAM_TARGET_CHANNEL }}
          GH_PAT: ${{ secrets.GH_PAT }}
          RHYTHM_USER: ${{ secrets.RHYTHM_USER }}
          RHYTHM_PASS: ${{ secrets.RHYTHM_PASS }}
          LAZYSANO_USER: ${{ secrets.LAZYSANO_USER }}
          LAZYSANO_PASS: ${{ secrets.LAZYSANO_PASS }}
          CELESTIAL_USER: ${{ secrets.CELESTIAL_USER }}
          CELESTIAL_PASS: ${{ secrets.CELESTIAL_PASS }}
          CELESTIAL_COOKIE: ${{ secrets.CELESTIAL_COOKIE }}
          REVIVE_USER: ${{ secrets.REVIVE_USER }}
          REVIVE_PASS: ${{ secrets.REVIVE_PASS }}
          REVIVE_COOKIE: ${{ secrets.REVIVE_COOKIE }}
          ANIMESAN_USER: ${{ secrets.ANIMESAN_USER }}
          ANIMESAN_PASS: ${{ secrets.ANIMESAN_PASS }}
          # Keep monitor alive in continuous loop for 25 minutes, checking every 60 seconds
          RUN_DURATION_MINUTES: 25
          CHECK_INTERVAL_SECONDS: 60
          # The tools the tool-check step could not find. A missing tool is
          # the root cause of the deferrals, so the runner prints it next to
          # the counters (M-07) — it is consumed, not just exported.
          TOOLS_MISSING: ${{ steps.verify-tools.outputs.tools_missing }}
        run: |
          node src/action-runner.mjs

      - name: Commit & Push Processed State
        id: commit
        if: always()
        env:
          # Step-scoped credential: used only as a per-command extraheader, never
          # stored in .git/config and never part of a URL (F9).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          # Default-deny (F-07): the state is treated as CORRUPT until a
          # verified merge AND a successful push have both happened.
          #
          # The SCRIPT is the sole writer of these outputs (M-08): it writes
          # state_corrupt=true as its FIRST action, so a script that dies
          # before the merge still leaves state_corrupt=true behind and the
          # chain stays blocked. The workflow must NOT pre-seed the value
          # any more — a duplicated key relies on GitHub's duplicate-key
          # resolution, which is not a contract worth depending on.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The merge + guard + commit + push (with its retry loop) lives in
          # the script so it is unit-testable; it fetches the remote tip
          # itself and builds the commit ON TOP of it (fast-forward by
          # construction — no rebase, no pull, no merge).
          if ! node scripts/merge-posted-state.mjs --push --attempts 3 \
            --local data/posted.json --title-map-local data/title-map.json \
            --out data/posted.json --title-map-out data/title-map.json \
            --github-output "$GITHUB_OUTPUT"; then
            # The script already emitted the precise reason (state corrupt /
            # push failed after 3 attempts) and wrote state_corrupt /
            # push_failed to $GITHUB_OUTPUT.
            exit 1
          fi

      - name: Chain next monitoring run
        if: always() && !cancelled() && steps.commit.outputs.state_corrupt != 'true' && steps.commit.outcome != 'failure'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # GITHUB_TOKEN can never trigger workflow_dispatch, so only chain
          # the next run when a PAT (GH_PAT) is configured. The cron schedule is
          # NOT a dependable fallback: measured on this repo, only 1 of the last
          # 10 runs came from `schedule` — the rest were this chain.
          if [ -z "$GH_PAT" ]; then
            echo "ℹ️ GH_PAT not set – skipping dispatch; the */15 cron keeps the monitor alive."
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot-monitor.yml/dispatches" \
            -d '{"ref":"main"}' \
            && echo "✅ Next monitoring run triggered successfully" \
            || { echo "❌ Dispatch failed — cron is NOT a reliable fallback (measured 1/10); failing this run so the stop is visible"; exit 1; }

      - name: Notify on failure
        if: failure() || cancelled()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Admin DM only — NEVER TELEGRAM_TARGET_CHANNEL, that is the public
          # channel and a failure notice there would be visible to followers.
          CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "ℹ️ Notification skipped — set TELEGRAM_ADMIN_CHAT_ID to enable failure alerts."
            exit 0
          fi
          # This step now also runs on cancellation, so the wording must fit
          # both cases: the bot may still be running through the chain, so
          # "stopped" would be wrong — the RUN failed.
          TEXT="🔴 Bot monitor run failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -o /dev/null -w "notify: HTTP %{http_code}\n"
