name: Anime Sub Auto-Poster Monitor

on:
  schedule:
    # Triggers every 15 minutes to initiate the next continuous monitor window
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: anime-sub-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Multimedia Tools
        run: |
          npm install --production
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mkvtoolnix aria2

      - name: Run Continuous Feed Monitor
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TARGET_CHANNEL: ${{ secrets.TELEGRAM_TARGET_CHANNEL }}
          RUN_DURATION_MINUTES: 14
          CHECK_INTERVAL_SECONDS: 45
        run: |
          node src/action-runner.mjs

      - name: Commit & Push Processed State
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted.json || true
          git commit -m "Update posted releases list [skip ci]" || true
          git push origin main || true
