name: Anime Sub Auto-Poster Monitor

on:
  schedule:
    # Runs every 5 minutes automatically 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Multimedia Tools
        run: |
          npm install
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mkvtoolnix aria2 megatools ffmpeg zip
          pip install --no-cache-dir mega.py gdown

      - name: Run Feed Monitor & Extract Subtitles
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TARGET_CHANNEL: ${{ secrets.TELEGRAM_TARGET_CHANNEL }}
        run: |
          node -e "import('./src/feed-monitor.mjs').then(m => m.checkNewReleases());"

      - name: Commit & Push Processed State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted.json || true
          git commit -m "Update posted releases list [skip ci]" || true
          git push origin main || true
