name: Anime Sub Auto-Poster Monitor

on:
  schedule:
    # One independent monitor cycle every 15 minutes.
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: anime-sub-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Dependencies & Multimedia Tools
        run: |
          npm ci --omit=dev
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mkvtoolnix aria2 megatools zip p7zip-full p7zip-rar unrar || sudo apt-get install -y --no-install-recommends p7zip-full
          pip install --no-cache-dir curl_cffi

      - name: Run continuous monitor loop
        env:
          # Some Arabic fansub sites use certificate chains trusted by the
          # runner's system store but absent from Node's bundled CA set.
          # Keep TLS validation enabled while allowing Node to use that store.
          NODE_OPTIONS: --use-system-ca
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TARGET_CHANNEL: ${{ secrets.TELEGRAM_TARGET_CHANNEL }}
          RHYTHM_USER: ${{ secrets.RHYTHM_USER }}
          RHYTHM_PASS: ${{ secrets.RHYTHM_PASS }}
          LAZYSANO_USER: ${{ secrets.LAZYSANO_USER }}
          LAZYSANO_PASS: ${{ secrets.LAZYSANO_PASS }}
          CELESTIAL_USER: ${{ secrets.CELESTIAL_USER }}
          CELESTIAL_PASS: ${{ secrets.CELESTIAL_PASS }}
          CELESTIAL_COOKIE: ${{ secrets.CELESTIAL_COOKIE }}
          REVIVE_USER: ${{ secrets.REVIVE_USER }}
          REVIVE_PASS: ${{ secrets.REVIVE_PASS }}
          REVIVE_COOKIE: ${{ secrets.REVIVE_COOKIE }}
          ANIMESAN_USER: ${{ secrets.ANIMESAN_USER }}
          ANIMESAN_PASS: ${{ secrets.ANIMESAN_PASS }}
          # Keep monitor alive in continuous loop for 25 minutes, checking every 60 seconds
          RUN_DURATION_MINUTES: 25
          CHECK_INTERVAL_SECONDS: 60
        run: |
          node src/action-runner.mjs

      - name: Commit & Push Processed State
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted.json data/title-map.json || true
          if git diff --cached --quiet; then
            echo "ℹ️ No state changes to commit."
          else
            git commit -m "Update posted releases list [skip ci]"
          fi
          if ! git push origin main; then
            echo "⚠️ First push failed – retrying after rebase..."
            git pull --rebase origin main || true
            if ! git push origin main; then
              echo "❌ Failed to push data/posted.json – state may be lost; next cycle will re-sync."
              exit 1
            fi
          fi
          echo "✅ State pushed."

      - name: Chain next monitoring run
        if: success()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # GITHUB_TOKEN can never trigger workflow_dispatch, so only chain
          # the next run when a PAT (GH_PAT) is configured; otherwise the
          # */15 cron schedule keeps the monitor alive.
          if [ -z "$GH_PAT" ]; then
            echo "ℹ️ GH_PAT not set – skipping dispatch; the */15 cron keeps the monitor alive."
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot-monitor.yml/dispatches" \
            -d '{"ref":"main"}' \
            && echo "✅ Next monitoring run triggered successfully" \
            || echo "⚠️ Could not trigger next run – relying on cron schedule as fallback"
