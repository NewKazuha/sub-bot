name: Manual Batch Subtitle Extractor & Publisher

on:
  workflow_dispatch:
    inputs:
      torrent_url:
        description: 'Nyaa or Direct .torrent URL'
        required: true
        default: 'https://nyaa.si/download/2176429.torrent'
      release_title:
        description: 'Release Title'
        required: true
        default: '[Netflix] Cyberpunk: Edgerunners 2 - [01 ~ 10]'
      caption:
        description: 'Telegram Post Caption'
        required: false
        default: '[Netflix] Cyberpunk: Edgerunners 2 - [01 ~ 10]'

concurrency:
  group: batch-extractor
  cancel-in-progress: false

jobs:
  extract-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max runtime to comfortably handle large torrents

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install Dependencies & Tools (aria2 & mkvtoolnix)
        run: |
          npm ci --omit=dev
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mkvtoolnix aria2

      - name: Run Batch Extractor & Publisher
        env:
          TORRENT_URL: ${{ github.event.inputs.torrent_url }}
          RELEASE_TITLE: ${{ github.event.inputs.release_title }}
          CAPTION: ${{ github.event.inputs.caption }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TARGET_CHANNEL: ${{ secrets.TELEGRAM_TARGET_CHANNEL }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          node scripts/extract-batch.mjs
