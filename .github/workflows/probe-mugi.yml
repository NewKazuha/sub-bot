name: Probe Mugi Runner

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install curl_cffi
        run: pip install --no-cache-dir curl_cffi

      - name: 1. Probe Node.js fetch (Baseline)
        run: |
          node -e '
            fetch("https://subs.mugisubs.workers.dev/0:/", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ password: "" })
            }).then(r => {
              console.log("Node fetch status:", r.status);
              return r.text().then(t => console.log("Node fetch response length:", t.length));
            }).catch(e => console.log("Node fetch error:", e.message));
          '

      - name: 2. Probe curl_cffi POST on Worker API
        run: |
          python -c '
          from curl_cffi import requests
          try:
              r = requests.post(
                  "https://subs.mugisubs.workers.dev/0:/",
                  json={"password": ""},
                  impersonate="chrome120",
                  timeout=30
              )
              print("curl_cffi POST status:", r.status_code)
              print("curl_cffi POST response length:", len(r.text))
              if r.status_code == 200:
                  print("Sample JSON preview:", r.text[:200])
          except Exception as e:
              print("curl_cffi POST error:", e)
          '

      - name: 3. Probe curl_cffi GET on Subtitle File (Bleach 50)
        run: |
          python -c '
          from curl_cffi import requests
          url = "https://subs.mugisubs.workers.dev/0:/Bleach%20-%20Sennen%20Kessen-hen%20S4/%5BESPADAS-3ASQ%5D%20Bleach%20Sennen%20Kessen-hen%20-%2050.ass"
          try:
              r = requests.get(url, impersonate="chrome120", stream=True, timeout=30)
              print("curl_cffi GET file status:", r.status_code)
              print("curl_cffi GET content-length:", r.headers.get("content-length"))
              chunk = next(r.iter_content(1024))
              print("curl_cffi GET read first chunk:", len(chunk), "bytes")
          except Exception as e:
              print("curl_cffi GET file error:", e)
          '

      - name: 4. Probe curl_cffi GET on Mugi Website Post
        run: |
          python -c '
          from curl_cffi import requests
          try:
              r = requests.get("https://www.mugi-subs.com/bleach-sennen-kessen-hen-50/", impersonate="chrome120", timeout=30)
              print("curl_cffi website status:", r.status_code)
              print("curl_cffi website response length:", len(r.text))
          except Exception as e:
              print("curl_cffi website error:", e)
          '
