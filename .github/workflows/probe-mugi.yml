name: Probe Mugi Runner

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          pip install --no-cache-dir curl_cffi
          npx playwright install --with-deps chromium

      - name: 1. Inspect 403 body content
        run: |
          python -c '
          from curl_cffi import requests
          r = requests.post("https://subs.mugisubs.workers.dev/0:/", json={"password": ""}, impersonate="chrome120")
          print("Status:", r.status_code)
          print("Headers:", dict(r.headers))
          print("Body:\n", r.text)
          '

      - name: 2. Probe Playwright Headless Chromium on Worker
        run: |
          node -e '
            const { chromium } = require("playwright");
            (async () => {
              const browser = await chromium.launch({ headless: true, args: ["--no-sandbox", "--disable-dev-shm-usage"] });
              const page = await browser.newPage();
              console.log("Navigating to worker via Playwright...");
              const res = await page.goto("https://subs.mugisubs.workers.dev/0:/", { waitUntil: "networkidle", timeout: 30000 }).catch(e => e.message);
              console.log("Playwright worker status:", typeof res === "object" && res ? res.status() : res);
              console.log("Playwright worker title:", await page.title().catch(() => "none"));
              await browser.close();
            })();
          '

      - name: 3. Probe Playwright Headless Chromium on Website Post
        run: |
          node -e '
            const { chromium } = require("playwright");
            (async () => {
              const browser = await chromium.launch({ headless: true, args: ["--no-sandbox", "--disable-dev-shm-usage"] });
              const page = await browser.newPage();
              console.log("Navigating to website post via Playwright...");
              const res = await page.goto("https://www.mugi-subs.com/bleach-sennen-kessen-hen-50/", { waitUntil: "domcontentloaded", timeout: 30000 }).catch(e => e.message);
              console.log("Playwright website status:", typeof res === "object" && res ? res.status() : res);
              console.log("Playwright website title:", await page.title().catch(() => "none"));
              const content = await page.content();
              console.log("Playwright website HTML length:", content.length);
              const hasCloudflareChallenge = content.includes("cf-turnstile") || content.includes("cf-chl-widget") || content.includes("challenges.cloudflare.com");
              console.log("Has Cloudflare challenge:", hasCloudflareChallenge);
              await browser.close();
            })();
          '
